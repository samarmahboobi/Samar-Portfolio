svg.scene{position:absolute;inset:0;width:720px;height:1280px;display:block}
.kb{transform-origin:360px 700px;animation:kb 26s ease-in-out infinite alternate}

.swanL{transform-origin:265px 1050px;animation:bobL 5.2s ease-in-out infinite alternate}
.swanR{transform-origin:505px 1078px;animation:bobR 5.9s ease-in-out -2s infinite alternate}
@keyframes bobL{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(2.2px,-2px) rotate(.5deg)}}
@keyframes bobR{0%{transform:translate(0,-1.5px) rotate(0)}100%{transform:translate(-2.2px,.5px) rotate(-.5deg)}}

/* light */
.light{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
.sun{position:absolute;left:330px;top:120px;width:380px;height:380px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,236,170,.75),rgba(255,200,110,.25) 40%,rgba(255,190,90,0) 70%);
  animation:sun 7s ease-in-out infinite alternate}
@keyframes sun{from{opacity:.55;transform:scale(.94)}to{opacity:1;transform:scale(1.06)}}
.rays{position:absolute;left:0;top:0;width:720px;height:1280px;transform-origin:540px 260px;animation:sway 14s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.8deg)}}
.ray{position:absolute;left:540px;top:260px;height:1050px;transform-origin:50% 0;filter:blur(7px);animation:flick var(--d) ease-in-out var(--dl) infinite alternate}
.ray i{display:block;width:100%;height:100%;clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);
  background:linear-gradient(to bottom,rgba(255,244,205,.0),rgba(255,236,180,.55) 8%,rgba(255,222,150,.22) 55%,rgba(255,210,130,0) 85%)}
@keyframes flick{0%{opacity:var(--a)}50%{opacity:calc(var(--a)*.35)}100%{opacity:calc(var(--a)*1.1)}}

.motes,.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mote{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff6d8;box-shadow:0 0 6px 2px rgba(255,230,160,.8);
  opacity:0;animation:mote var(--d) linear var(--dl) infinite}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}85%{opacity:.7}100%{opacity:0;transform:translate(var(--x),-160px)}}
.petal{position:absolute;top:-30px;width:11px;height:8px;border-radius:70% 10% 70% 10%;background:linear-gradient(135deg,#ffd6e0,#e8a0b4);
  opacity:.6;filter:blur(.4px);animation:fall var(--d) linear var(--dl) infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(28px,330px) rotate(140deg)}50%{transform:translate(-12px,660px) rotate(260deg)}75%{transform:translate(30px,990px) rotate(400deg)}100%{transform:translate(4px,1330px) rotate(540deg)}}

/* text */
.veil{position:absolute;inset:0 0 auto 0;height:960px;background:linear-gradient(to bottom,rgba(28,16,4,.62),rgba(28,16,4,.42) 45%,rgba(28,16,4,.18) 75%,rgba(28,16,4,0));pointer-events:none}
.veil2{position:absolute;inset:auto 0 0 0;height:200px;background:linear-gradient(to top,rgba(20,12,3,.55),rgba(20,12,3,0));pointer-events:none}
.txt{position:absolute;top:76px;left:70px;right:70px;text-align:center;color:#fffaf0;
  text-shadow:0 2px 18px rgba(60,30,0,.55),0 0 1px rgba(60,30,0,.4)}
.a{opacity:0;transform:translateY(14px);animation:up 1.5s cubic-bezier(.2,.7,.2,1) var(--t) forwards}
@keyframes up{to{opacity:1;transform:none}}
.cap{font-weight:300;text-transform:uppercase}
.pre{font-size:19px;letter-spacing:.42em;margin-right:-.42em;line-height:1.75}
#dear{display:inline}
.has-dear .pre{white-space:nowrap;letter-spacing:.3em;margin-right:-.3em}
.has-dear .name{margin-top:12px}
.name{font-family:P;font-weight:400;font-size:132px;line-height:1.05;margin:22px 0 -6px}
.row{display:flex;justify-content:center;align-items:center;gap:20px;margin-left:70px}
.n16{font-family:B,Didot,serif;font-weight:400;font-size:300px;line-height:.9;letter-spacing:-.02em;color:#fff;
  text-shadow:0 0 28px rgba(255,236,190,.55),0 4px 30px rgba(60,30,0,.45)}
.note{text-align:left;font-size:14px;line-height:2.1;letter-spacing:.3em;color:#fff3dc}
.note svg{display:block;width:22px;height:20px;margin-top:8px}
.bday{font-size:50px;letter-spacing:.5em;margin:18px -.5em 0 0;color:#fff}
.quote{font-family:P;font-size:36px;line-height:1.3;margin:20px auto 0;max-width:540px;color:#fff1d6;text-wrap:balance}
.date{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:28px 26px 0}
.date .side{font-size:14px!important;border-top:1px solid rgba(255,240,215,.7);border-bottom:1px solid rgba(255,240,215,.7);padding:15px 0;font-size:15px;letter-spacing:.26em}
.date .mid{border-left:1px solid rgba(255,240,215,.7);border-right:1px solid rgba(255,240,215,.7);padding:4px 26px;line-height:1.2}
.date .mid b{display:block;font-family:B,Didot,serif;font-weight:400;font-size:58px;letter-spacing:0;color:#fff;margin:2px 0}
.date .mid i{display:block;font-style:normal;font-size:15px;letter-spacing:.3em;margin-right:-.3em}
.sh{font-size:14px;letter-spacing:.34em;margin:16px -.34em 0 0;color:#ffe9c6}
.btn{position:absolute;left:50%;top:1172px;transform:translateX(-50%);white-space:nowrap;padding:15px 38px;border:1px solid rgba(255,240,215,.8);border-radius:40px;
  color:#fffaf0;text-decoration:none;font-size:15px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;background:rgba(40,22,4,.3);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;animation:fadebtn 1.5s ease var(--t) forwards}
.btn span{margin-right:-.3em}
@keyframes fadebtn{to{opacity:1}}

.mus{position:fixed;z-index:5;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:center;width:40px;height:40px;
  border:1px solid rgba(255,240,215,.6);border-radius:30px;background:rgba(40,22,4,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:#fffaf0;font:400 11px/1 M,Helvetica,Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;opacity:0;animation:fadebtn 1.2s ease 3.6s forwards;-webkit-tap-highlight-color:transparent}
.mus .eq{display:none!important}.mus.on .eq{display:flex!important}.mus.on .note{display:none}
.mus .eq{display:flex;align-items:flex-end;gap:2px;width:14px;height:14px}
.mus .eq i{flex:1;background:#fffaf0;height:30%;border-radius:1px;transition:height .3s}
.mus.on .eq i{animation:eq .9s ease-in-out infinite alternate}
.mus.on .eq i:nth-child(2){animation-delay:-.3s}.mus.on .eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{from{height:20%}to{height:100%}}
.mus:not(.on):not(.used){box-shadow:0 0 0 0 rgba(255,236,190,.5);animation:fadebtn 1.2s ease 3.6s forwards,ping 2.4s ease-out 4.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,236,190,.45)}100%{box-shadow:0 0 0 14px rgba(255,236,190,0)}}

/* letter reveal + silver glitter */
.w{white-space:nowrap}
.ch{display:inline-block;opacity:0;will-change:opacity,transform,filter}
.ch.in{animation:chin 1.1s cubic-bezier(.2,.75,.25,1) forwards}
@keyframes chin{0%{opacity:0;transform:translateX(-4px) scale(.96);filter:blur(9px)}45%{opacity:.75;filter:blur(3px)}100%{opacity:1;transform:none;filter:none}}
@keyframes flash{0%{color:#fff;text-shadow:0 0 10px #fff,0 0 22px rgba(225,232,245,.95)}100%{}}
